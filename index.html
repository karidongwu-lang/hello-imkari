<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kari Wu</title>
<link rel="stylesheet" href="css/styles.css?v=79">
<link rel="stylesheet" href="css/sketchbook.css?v=29">
<link rel="stylesheet" href="css/case-study.css?v=7">
<!-- hints for the handful of assets visible the instant the page paints
     (default landing tab is Work) — gets the browser fetching these
     before it's even finished parsing the CSS/JS that would otherwise
     be what first reveals they're needed at all -->
<link rel="preload" as="image" href="cuttingmat.svg">
<link rel="preload" as="image" href="assets/sketchbook-work/cover-front.webp">
</head>
<body>

<main id="main">

  <!-- WORK TAB -->
  <section class="tab tab--work" id="tab-work" data-state="closed">
    <div class="mat-frame mat-frame--sticky" id="work-hero">
      <div class="mat" id="work-mat">
        <img class="mat-bg" src="cuttingmat.svg" alt="">

        <h1 class="headline" id="work-headline">Hello! I&rsquo;m Kari</h1>

        <div class="sketchbook-mount" id="work-book"></div>

        <div class="notecards" id="notecards">
          <button class="notecard" data-card="previa" type="button" style="--cx:67.1%; --cy:39.5%; --w:27%; --r:9.14deg;">
            <img src="about/prevanotecard.png" alt="Preva notecard">
          </button>
          <button class="notecard" data-card="build-our-bridges" type="button" style="--cx:55%; --cy:63.8%; --w:26.5%; --r:-6.98deg;">
            <img src="about/buildourbridgesnotecard.png" alt="Build Our Bridges notecard">
          </button>
          <button class="notecard" data-card="smart-pill-dispenser" type="button" style="--cx:31.7%; --cy:38.9%; --w:27.4%; --r:-10.91deg;">
            <img src="about/pilldispensernotecard.png" alt="Pill Dispenser notecard">
          </button>
        </div>

        <button class="back-btn" id="work-back" type="button" hidden>(back)</button>

        <nav class="mat-nav" data-nav-group>
          <button class="nav-link" data-tab="about">(about)</button>
          <button class="nav-link" data-tab="work">(work)</button>
          <button class="nav-link" data-tab="art">(art)</button>
        </nav>
      </div>
    </div>

    <div class="scroll-spacer" id="work-spacer"></div>

    <div class="prv-sidebar" id="case-study-sidebar"></div>
    <section class="case-study" id="case-study" data-slug="" hidden></section>
  </section>

  <!-- ART TAB -->
  <section class="tab tab--art" id="tab-art" data-state="cover" hidden>
    <div class="mat-frame" id="art-frame">
      <div class="mat mat--art" id="art-mat">
        <img class="mat-bg" src="cuttingmat.svg" alt="">

        <h1 class="headline">Hello! I&rsquo;m Kari</h1>

        <div class="art-scatter" id="art-scatter"></div>

        <!-- matches work/about exactly (same DOM position relative to
             .mat) so the landing/cover state's nav lines up pixel-for-
             pixel with the other two tabs. Swapped out for the fixed
             .art-fixed-nav copy below once expanded. -->
        <nav class="mat-nav" data-nav-group>
          <button class="nav-link" data-tab="about">(about)</button>
          <button class="nav-link" data-tab="work">(work)</button>
          <button class="nav-link" data-tab="art">(art)</button>
        </nav>
      </div>
    </div>

    <div class="art-grid" id="art-grid"></div>

    <button class="art-cta" id="art-cta" type="button" hidden>check out my studies!</button>

    <button class="art-logo art-fixed-nav" id="art-logo" type="button">Kari</button>

    <button class="back-btn art-fixed-nav" id="art-back" type="button" hidden>(back)</button>

    <nav class="mat-nav art-fixed-nav" data-nav-group>
      <button class="nav-link" data-tab="about">(about)</button>
      <button class="nav-link" data-tab="work">(work)</button>
      <button class="nav-link" data-tab="art">(art)</button>
    </nav>

    <nav class="sub-nav art-fixed-nav" id="art-subnav" hidden>
      <button class="nav-link" data-sub="illustrations">(illustrations)</button>
      <button class="nav-link" data-sub="sketches">(studies)</button>
    </nav>
  </section>

  <!-- ABOUT TAB -->
  <section class="tab tab--about" id="tab-about" data-state="closed" hidden>
    <div class="mat-frame">
      <div class="mat" id="about-mat">
        <img class="mat-bg" src="cuttingmat.svg" alt="">

        <h1 class="headline">Hello! I&rsquo;m Kari</h1>

        <div class="sketchbook-mount" id="about-book"></div>

        <button class="polaroid-trigger" id="polaroid-trigger" type="button" aria-label="View photos"></button>

        <div class="polaroids" id="polaroids">
          <img class="polaroid" data-i="0" src="about/poloraid1.webp" alt="Polaroid: i love the metro">
          <img class="polaroid" data-i="1" src="about/poloraid2.webp" alt="Polaroid">
          <img class="polaroid" data-i="2" src="about/poloraid3.webp" alt="Polaroid">
          <img class="polaroid" data-i="3" src="about/poloraid4.webp" alt="Polaroid">
        </div>

        <button class="back-btn" id="about-back" type="button" hidden>(back)</button>

        <nav class="mat-nav" data-nav-group>
          <button class="nav-link" data-tab="about">(about)</button>
          <button class="nav-link" data-tab="work">(work)</button>
          <button class="nav-link" data-tab="art">(art)</button>
        </nav>
      </div>
    </div>
  </section>

</main>

<div class="art-lightbox" id="art-lightbox">
  <button class="art-book-lightbox-close" id="art-lightbox-close" type="button" aria-label="Close">&times;</button>
  <button class="art-lightbox-arrow left" id="art-lightbox-prev" type="button" aria-label="Previous artwork">
    <svg viewBox="0 0 14 44" width="18" height="56" fill="none" aria-hidden="true"><polyline points="11,3 3,22 11,41" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <button class="art-lightbox-arrow right" id="art-lightbox-next" type="button" aria-label="Next artwork">
    <svg viewBox="0 0 14 44" width="18" height="56" fill="none" aria-hidden="true"><polyline points="3,3 11,22 3,41" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <div class="art-lightbox-frame">
    <img id="art-lightbox-img" src="" alt="">
    <div class="art-lightbox-caption">
      <p class="art-lightbox-title" id="art-lightbox-title"></p>
      <p class="art-lightbox-meta" id="art-lightbox-meta"></p>
    </div>
  </div>
</div>

<div class="art-book-lightbox" id="art-book-lightbox">
  <button class="art-book-lightbox-close" id="art-book-close" type="button" aria-label="Close">&times;</button>
  <div class="art-book-lightbox-frame">
    <div class="sketchbook-mount" id="art-book-mount"></div>
  </div>
</div>

<script src="js/projects.js?v=2"></script>
<script src="js/main.js?v=66" type="module"></script>
</body>
</html>
